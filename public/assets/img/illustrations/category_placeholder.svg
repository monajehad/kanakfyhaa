<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box {
      fill: #f3f4f6;
      stroke: #d1d5db;
      stroke-width: 2;
      rx: 12;
      ry: 12;
    }
    .icon {
      stroke: #9ca3af;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .text {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      fill: #9ca3af;
      text-anchor: middle;
    }
  </style>

  <!-- Background box -->
  <rect class="box" x="5" y="5" width="110" height="110" />

  <!-- Placeholder icon (mountains + sun) -->
  <circle class="icon" cx="80" cy="40" r="8" />
  <path class="icon" d="M25 85 L50 55 L75 85 Z" />
  <path class="icon" d="M50 85 L70 65 L95 85 Z" />

  <!-- Label text -->
  <text class="text" x="60" y="108">Category</text>
</svg>
